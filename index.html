<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 미니도서관 도서 대여/예약 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 mb-6">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                📚 우리반 미니도서관 대여 시스템
            </h1>
            <span class="text-indigo-200 text-sm">초등학교 교실 독서 지도 도우미</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 w-full flex-grow pb-12 space-y-8">

        <!-- 1. 예약/대여 등록 섹션 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold text-indigo-700 mb-4 flex items-center gap-2">
                ✨ 도서 대여 예약하기
            </h2>
            <form id="reservation-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">도서 선택</label>
                    <select id="room-select" required class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">도서를 선택하세요</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">대여 날짜</label>
                    <input type="date" id="reservation-date" required class="w-full border border-slate-200 rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">반납 예정일</label>
                    <input type="date" id="due-date" required class="w-full border border-slate-200 rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">목적 또는 메모 (선택)</label>
                    <input type="text" id="purpose" placeholder="예: 독후감 숙제용" class="w-full border border-slate-200 rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="sm:col-span-2 lg:col-span-4 flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition shadow-sm w-full sm:w-auto">
                        예약 등록하기
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. 주간 시간표(현황) 섹션 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                <div>
                    <h2 class="text-lg font-semibold text-indigo-700 flex items-center gap-2">
                        📅 주간 도서 대여 현황
                    </h2>
                    <p id="week-range-label" class="text-xs text-slate-500 mt-0.5"></p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="prev-week" type="button" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-medium hover:bg-slate-100 transition">이전 주</button>
                    <button id="today-week" type="button" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-medium hover:bg-slate-100 transition">이번 주</button>
                    <button id="next-week" type="button" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-medium hover:bg-slate-100 transition">다음 주</button>
                </div>
            </div>

            <!-- 도서 선택 필터 -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-500 mb-1">시간표로 조회할 도서</label>
                <select id="schedule-room-select" class="w-full sm:w-72 border border-slate-200 rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">-- 도서를 선택하세요 --</option>
                </select>
            </div>

            <!-- 주간 표 -->
            <div class="overflow-x-auto border border-slate-100 rounded-xl">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-100 text-slate-600 text-xs uppercase">
                        <tr>
                            <th class="p-3 border-b text-center w-24">요일</th>
                            <th class="p-3 border-b text-center w-28">날짜</th>
                            <th class="p-3 border-b">대여 상태 / 메모</th>
                        </tr>
                    </thead>
                    <tbody id="weekly-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="3" class="p-6 text-center text-slate-400">도서를 선택하면 해당 주간 대여 현황이 표시됩니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 3. 검색 및 예약 목록 / 취소 섹션 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                <h2 class="text-lg font-semibold text-indigo-700 flex items-center gap-2">
                    🔍 예약 내역 검색 및 관리
                </h2>
                <div class="w-full sm:w-auto">
                    <input type="text" id="search-input" placeholder="도서명 또는 날짜 검색..." class="w-full sm:w-64 border border-slate-200 rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div class="overflow-x-auto border border-slate-100 rounded-xl">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-100 text-slate-600 text-xs uppercase">
                        <tr>
                            <th class="p-3 border-b">도서명</th>
                            <th class="p-3 border-b">위치</th>
                            <th class="p-3 border-b">대여 날짜</th>
                            <th class="p-3 border-b">반납 예정일</th>
                            <th class="p-3 border-b">목적/메모</th>
                            <th class="p-3 border-b text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="reservation-list-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="p-6 text-center text-slate-400">불러오는 중...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JavaScript 로직 -->
    <script>
        // ==========================================
        // Supabase 설정 (본인의 URL과 ANON KEY를 입력하세요)
        // ==========================================
        const SUPABASE_URL = 'https://ihjegjduwwrkrlhitpej.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_05hcHXLpke3ini5tjxiLVg_UmT0XidN';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 전역 상태 변수
        let roomsData = [];
        let reservationsData = [];
        let currentMonday = getMonday(new Date());

        // 날짜 관련 유틸 함수 (이번 주 월요일 구하기)
        function getMonday(d) {
            d = new Date(d);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // 초기화 실행
        window.addEventListener('DOMContentLoaded', () => {
            const todayStr = formatDate(new Date());
            document.getElementById('reservation-date').value = todayStr;
            
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('due-date').value = formatDate(nextWeek);

            fetchRooms();
            fetchReservations();

            // 이벤트 리스너 연결
            document.getElementById('reservation-form').addEventListener('submit', handleReservationSubmit);
            document.getElementById('search-input').addEventListener('input', renderReservationList);
            document.getElementById('schedule-room-select').addEventListener('change', renderWeeklySchedule);

            // 주간 이동 버튼
            document.getElementById('prev-week').addEventListener('click', () => {
                currentMonday.setDate(currentMonday.getDate() - 7);
                updateWeekRangeLabel();
                renderWeeklySchedule();
            });
            document.getElementById('today-week').addEventListener('click', () => {
                currentMonday = getMonday(new Date());
                updateWeekRangeLabel();
                renderWeeklySchedule();
            });
            document.getElementById('next-week').addEventListener('click', () => {
                currentMonday.setDate(currentMonday.getDate() + 7);
                updateWeekRangeLabel();
                renderWeeklySchedule();
            });

            updateWeekRangeLabel();
        });

        function updateWeekRangeLabel() {
            const sunday = new Date(currentMonday);
            sunday.setDate(sunday.getDate() + 4);
            document.getElementById('week-range-label').textContent = 
                `${formatDate(currentMonday)} ~ ${formatDate(sunday)}`;
        }

        // 1. 도서 목록 불러오기
        async function fetchRooms() {
            const { data, error } = await supabaseClient.from('rooms').select('*').order('id');
            if (error) {
                console.error('도서 목록 로딩 실패:', error.message);
                return;
            }
            roomsData = data || [];
            
            const roomSelect = document.getElementById('room-select');
            const scheduleRoomSelect = document.getElementById('schedule-room-select');
            
            roomSelect.innerHTML = '<option value="">도서를 선택하세요</option>';
            scheduleRoomSelect.innerHTML = '<option value="">-- 도서를 선택하세요 --</option>';

            roomsData.forEach(room => {
                roomSelect.innerHTML += `<option value="${room.id}">${room.name} (${room.location || '위치 미정'})</option>`;
                scheduleRoomSelect.innerHTML += `<option value="${room.id}">${room.name}</option>`;
            });
        }

        // 2. 예약 목록 불러오기
        async function fetchReservations() {
            const { data, error } = await supabaseClient
                .from('reservations')
                .select(`
                    id,
                    room_id,
                    reservation_date,
                    due_date,
                    purpose,
                    created_at,
                    rooms ( id, name, location )
                `)
                .order('reservation_date', { ascending: true });

            if (error) {
                console.error('예약 내역 로딩 실패:', error.message);
                return;
            }

            reservationsData = data || [];
            renderReservationList();
            renderWeeklySchedule();
        }

        // 3. 예약 등록 처리 (오류 코드 23505 처리 포함)
        async function handleReservationSubmit(e) {
            e.preventDefault();

            const room_id = document.getElementById('room-select').value;
            const reservation_date = document.getElementById('reservation-date').value;
            const due_date = document.getElementById('due-date').value;
            const purpose = document.getElementById('purpose').value;

            const { error } = await supabaseClient
                .from('reservations')
                .insert([{ room_id, reservation_date, due_date, purpose }]);

            if (error) {
                if (error.code === '23505') {
                    alert('이미 예약된 도서입니다.');
                } else {
                    alert('예약 중 오류가 발생했습니다: ' + error.message);
                }
                fetchReservations();
                return;
            }

            alert('성공적으로 예약되었습니다!');
            document.getElementById('reservation-form').reset();
            document.getElementById('reservation-date').value = formatDate(new Date());
            fetchReservations();
        }

        // 4. 예약 삭제(취소) 처리
        async function cancelReservation(id) {
            if (!confirm('정말 대여 예약을 취소하시겠습니까?')) return;

            const { error } = await supabaseClient
                .from('reservations')
                .delete()
                .eq('id', id);

            if (error) {
                alert('취소 실패: ' + error.message);
                return;
            }

            alert('대여가 취소되었습니다.');
            fetchReservations();
        }

        // 5. 검색 및 예약 목록 렌더링
        function renderReservationList() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const tbody = document.getElementById('reservation-list-body');

            const filtered = reservationsData.filter(item => {
                const roomName = item.rooms ? item.rooms.name.toLowerCase() : '';
                const dateStr = item.reservation_date.toLowerCase();
                const purposeStr = (item.purpose || '').toLowerCase();
                return roomName.includes(keyword) || dateStr.includes(keyword) || purposeStr.includes(keyword);
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">검색 결과가 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 font-medium text-slate-700">${item.rooms ? item.rooms.name : '알 수 없음'}</td>
                    <td class="p-3 text-slate-500 text-xs">${item.rooms ? (item.rooms.location || '-') : '-'}</td>
                    <td class="p-3 text-slate-600">${item.reservation_date}</td>
                    <td class="p-3 text-slate-600">${item.due_date}</td>
                    <td class="p-3 text-slate-600">${item.purpose || '-'}</td>
                    <td class="p-3 text-center">
                        <button type="button" onclick="cancelReservation(${item.id})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium px-3 py-1 rounded text-xs transition">
                            취소
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 6. 주간 시간표 렌더링 (월~금 표)
        function renderWeeklySchedule() {
            const selectedRoomId = document.getElementById('schedule-room-select').value;
            const tbody = document.getElementById('weekly-table-body');

            if (!selectedRoomId) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-slate-400">도서를 선택하면 해당 주간 대여 현황이 표시됩니다.</td></tr>`;
                return;
            }

            const weekdays = ['월', '화', '수', '목', '금'];
            let html = '';

            for (let i = 0; i < 5; i++) {
                const targetDate = new Date(currentMonday);
                targetDate.setDate(currentMonday.getDate() + i);
                const dateStr = formatDate(targetDate);

                const matched = reservationsData.find(item => 
                    String(item.room_id) === String(selectedRoomId) && item.reservation_date === dateStr
                );

                html += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 text-center font-medium text-slate-700">${weekdays[i]}요일</td>
                        <td class="p-3 text-center text-slate-500 text-xs">${dateStr}</td>
                        <td class="p-3">
                            ${matched ? `
                                <div class="flex justify-between items-center bg-indigo-50 border border-indigo-100 p-2 rounded-lg text-indigo-900">
                                    <div>
                                        <span class="font-semibold text-xs bg-indigo-200 px-2 py-0.5 rounded text-indigo-800 mr-2">대여중</span>
                                        <span class="text-xs text-slate-600">반납예정: ${matched.due_date}</span>
                                        ${matched.purpose ? `<p class="text-xs text-slate-500 mt-0.5">메모: ${matched.purpose}</p>` : ''}
                                    </div>
                                    <button type="button" onclick="cancelReservation(${matched.id})" class="text-rose-500 hover:text-rose-700 text-xs font-medium px-2 py-1 bg-white border border-rose-200 rounded shadow-sm">취소</button>
                                </div>
                            ` : `<span class="text-slate-400 text-xs">대여 가능</span>`}
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
